info:
  name: Find all expenses
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/expenses"
  headers:
    - name: Authorization
      value: Bearer{{token}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut 200", function(){
          expect(res.getStatus()).to.equal(200)
        });

        test("La réponse est un tableau", function(){
          expect(res.getBody()).to.be.an("array")
        });

        test("Contient au moins une tâche", function(){
          expect(res.getBody().length).to.be.above(0)
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
